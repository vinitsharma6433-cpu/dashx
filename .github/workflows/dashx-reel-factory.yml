name: DASHX Reel Factory
# Makes dialogue reels in the cloud (Kokoro Hindi voice, revideo, ffmpeg), runs every PASS/FAIL check, and only then
# adds the reels to poster/queue.json. A reel that fails a check is never queued and the job goes red.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many reels to make"
        default: "2"
      test_only:
        description: "Test run: make and check the reels but do NOT push anything (reels are kept as a download only)"
        type: boolean
        default: true
  # ENABLED (owner OK): every night at 02:00 IST it makes 2 reels (count 2, test_only OFF) and queues them for the next two free
  # slots, 12:30 and 20:30 IST. To pause: create a file named STOP_QUEUE in the repo root (or in reelfactory/), or comment these 2 lines out.
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC = 02:00 IST
permissions:
  contents: write
concurrency:
  group: dashx-poster          # same group as the poster, so the two never edit queue.json at the same time
  cancel-in-progress: false
jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHX_CI: "1"
      DASHX_REPO_DIR: ${{ github.workspace }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: reelfactory
    steps:
      - uses: actions/checkout@v4

      - name: Kill switch (STOP_QUEUE)
        id: stop
        working-directory: .
        run: |
          if [ -e STOP_QUEUE ] || [ -e reelfactory/STOP_QUEUE ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::STOP_QUEUE file exists - factory paused, nothing was made"
          fi

      - uses: actions/setup-python@v5
        if: steps.stop.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reelfactory/requirements-ci.txt
      - uses: actions/setup-node@v4
        if: steps.stop.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Cache node_modules and Chromium
        if: steps.stop.outputs.skip != 'true'
        id: nm
        uses: actions/cache@v4
        with:
          path: |
            reelfactory/node_modules
            ~/.cache/puppeteer
          key: nm-${{ runner.os }}-${{ hashFiles('reelfactory/package-lock.json') }}
      - name: Cache Kokoro model
        if: steps.stop.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: reelfactory/models
          key: kokoro-v1.0

      - name: Install ffmpeg and Chromium libraries
        if: steps.stop.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libatk-bridge2.0-0 libgbm1 libasound2t64 libxkbcommon0 libxdamage1 libxrandr2 libcups2 libpango-1.0-0 libcairo2
      - name: Install dependencies
        if: steps.stop.outputs.skip != 'true'
        run: |
          pip install -r requirements-ci.txt requests
          if [ "${{ steps.nm.outputs.cache-hit }}" != "true" ]; then npm ci --force; fi  # --force: the Windows-made lockfile lists @esbuild/aix-ppc64 as required, which fails EBADPLATFORM on Linux
          npx tsc
      - name: Download Kokoro model (only when not cached)
        if: steps.stop.outputs.skip != 'true'
        run: |
          # The GitHub release download of the 310 MB model sometimes answers 504, so: 3 tries there, then the same
          # files from the Hugging Face mirror. Both are checked against the SHA256 of the files the factory was built with.
          mkdir -p models
          gh_base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          hf_base=https://huggingface.co/fastrtc/kokoro-onnx/resolve/main
          get() {  # file sha256
            [ -s "models/$1" ] && echo "$2  models/$1" | sha256sum -c - && return 0
            rm -f "models/$1"
            for url in "$gh_base/$1" "$hf_base/$1"; do
              curl -fL --retry 3 --retry-all-errors --retry-delay 5 -o "models/$1" "$url" || continue
              echo "$2  models/$1" | sha256sum -c - && return 0
              rm -f "models/$1"
            done
            echo "::error::could not download $1 with the expected checksum"; return 1
          }
          get kokoro-v1.0.onnx 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5
          get voices-v1.0.bin  bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
          ls -l models

      - name: Make reels (story -> Hindi voice -> render -> QC)
        if: steps.stop.outputs.skip != 'true'
        run: python -m factory daily "${{ github.event.inputs.count || '2' }}" --source bank

      - name: Queue reels that passed every check
        if: steps.stop.outputs.skip != 'true'
        run: python -m factory queue ${{ github.event.inputs.test_only == 'true' && '--no-push' || '' }}

      - name: Save used stories (also after a failed check, so a bad story is not retried forever)
        if: always() && steps.stop.outputs.skip != 'true' && github.event.inputs.test_only != 'true'
        working-directory: .
        run: |
          git config user.name "dashx-factory"
          git config user.email "dashx-factory@users.noreply.github.com"
          git add reelfactory/stories/used.md reelfactory/reels/*/script.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Factory: mark stories as used"
            for i in 1 2 3 4 5; do
              if git pull --rebase -q --autostash origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 6))
            done
            echo "::error::could not push the used-stories list"; exit 1
          fi

      - name: Summary
        if: always() && steps.stop.outputs.skip != 'true'
        run: |
          { echo "### DASHX Reel Factory"; cat output/reports/*.md 2>/dev/null || echo "no report"; echo; echo "$(cat stories/refill_daily.txt 2>/dev/null || echo 'Story refill: no report yet')"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep videos and reports for inspection
        if: always() && steps.stop.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: factory-output
          path: |
            reelfactory/output/ready
            reelfactory/output/reports
            reelfactory/logs
          retention-days: 7
          if-no-files-found: ignore
