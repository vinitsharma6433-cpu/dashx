name: HF Free AI Ad Clips
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hf-ad
  cancel-in-progress: false
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gradio_client
      - name: Make clips
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p social/hf-ad
          python tools/hf_ad.py tools/scenes_ad.json social/hf-ad 2>&1 | tee social/hf-ad/log.txt
      - name: Save results
        if: always()
        run: |
          git config user.name "dashx-poster"
          git config user.email "dashx-poster@users.noreply.github.com"
          git add social/hf-ad
          git diff --cached --quiet || (git commit -m "HF ad clips result" && git pull --rebase -q && git push)
