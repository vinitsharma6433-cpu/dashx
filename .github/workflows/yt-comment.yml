name: YT comment backfill
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python poster/ytcomment.py | tee poster/ytcomment_log.txt; exit 0
      - run: |
          git config user.name dashx-poster; git config user.email dashx-poster@users.noreply.github.com
          git add poster/ytcomment_log.txt poster/ytcomment_result.json || true
          git commit -qm "yt comment result" || true; git pull --rebase -q; git push
