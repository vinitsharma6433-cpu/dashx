name: DASHX Auto Poster
on:
  schedule:
    - cron: "*/15 * * * *"
    # GitHub runs scheduled workflows only ~4 times a day on this repo (measured: median gap 6.3 h), so extra lines are packed around the two
    # slots. Cron is UTC: 12:25-13:15 IST = 06:55-07:45 UTC, 20:25-21:15 IST = 14:55-15:45 UTC. Overlapping runs just queue (same concurrency group).
    - cron: "55 6 * * *"
    - cron: "0-45/5 7 * * *"
    - cron: "55 14 * * *"
    - cron: "0-45/5 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashx-poster
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post due items
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python poster/poster.py
      - name: Save results
        if: always()   # also after a failed post (e.g. invalid Meta token), so the results are never lost
        run: |
          git config user.name "dashx-poster"
          git config user.email "dashx-poster@users.noreply.github.com"
          git add poster/queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Poster: update queue results"
            # the factory also edits queue.json (it only runs when this job is not running: same concurrency group), so retry the rebase + push
            for i in 1 2 3 4 5; do
              if git pull --rebase -q --autostash origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 6))
            done
            echo "::error::could not push the poster results to queue.json"; exit 1
          fi
