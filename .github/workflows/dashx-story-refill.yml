name: DASHX Story Refill
# Keeps stories/dialogue_bank.md from ever running dry. Every night at 01:30 IST (before the 02:00 reel factory) it counts the usable
# stories; if fewer than 14 are left it has a free model (GitHub Models) write new ones. A new story is added ONLY if it passes the
# same checks as a hand-written one (format, DASHX rules, score >= 80, no repeated line/ending/hook) AND a second model call
# grades it funny/clear/natural Hindi/kid-safe >= 7. Nothing is deleted. To pause: create a file named STOP_QUEUE (or STOP_REFILL).
on:
  workflow_dispatch:
    inputs:
      make:
        description: "How many new stories to aim for"
        default: "6"
      force:
        description: "Write even if the bank is not low"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: write nothing to the bank, only show the accepted stories in the log and as a download"
        type: boolean
        default: true
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 01:30 IST
permissions:
  contents: write
  models: read   # lets the built-in GITHUB_TOKEN call GitHub Models (free, no extra key)
concurrency:
  group: dashx-refill   # its own group: a slow refill must never hold up the poster or the reel factory (it only edits the story bank files)
  cancel-in-progress: false
jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: reelfactory
    steps:
      - uses: actions/checkout@v4
      - name: Pause switch
        id: stop
        working-directory: .
        run: |
          if [ -e STOP_QUEUE ] || [ -e reelfactory/STOP_QUEUE ] || [ -e STOP_REFILL ] || [ -e reelfactory/STOP_REFILL ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::warning::paused by a STOP file"
          fi
      - uses: actions/setup-python@v5
        if: steps.stop.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reelfactory/requirements-ci.txt
      - name: Install dependencies
        if: steps.stop.outputs.skip != 'true'
        run: pip install -r requirements-ci.txt requests
      - name: Write new stories when the bank is low
        if: steps.stop.outputs.skip != 'true'
        timeout-minutes: 11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional backup provider (free key); empty = not used
          HF_TOKEN: ${{ secrets.HF_TOKEN }}                # last-resort provider (needs paid credits)
        run: python scripts/refill_bank.py --min-usable 14 --make "${{ github.event.inputs.make || '8' }}" ${{ github.event.inputs.force == 'true' && '--force' || '' }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Save new stories
        if: steps.stop.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        working-directory: .
        run: |
          git config user.name "dashx-factory"
          git config user.email "dashx-factory@users.noreply.github.com"
          git add reelfactory/stories/dialogue_bank.md reelfactory/stories/refill_log.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Story refill: new stories for the bank"
            for i in 1 2 3 4 5; do
              if git pull --rebase -q --autostash origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 6))
            done
            echo "::error::could not push the new stories"; exit 1
          fi
      - name: Keep the dry-run stories
        if: always() && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refill-dry-run
          path: reelfactory/stories/refill_dry_run.md
          if-no-files-found: ignore
