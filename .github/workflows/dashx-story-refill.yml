name: DASHX Story Refill
# Adds 2 new stories a day to stories/dialogue_bank.md with the free Gemini key, using very little quota:
#  - stops as soon as 2 stories are accepted; at most 12 Gemini calls per quota day; a 429/quota answer ends the day
#  - skipped when the bank has more than 60 usable stories
#  - every story must pass the same checks as a hand-written one (format, DASHX rules, duplicates, score >= 80) + a second-model grade >= 7
#  - it runs in its OWN concurrency group and ALWAYS finishes green: a Gemini error/quota/timeout is only a warning,
#    it can never block or turn red the poster or the reel factory. No new story = the factory keeps using the old bank.
# 14:00 IST = just after Gemini's free quota resets (~13:30 IST). To pause: create a file named STOP_REFILL (or STOP_QUEUE).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Stories to aim for (daily default 2)"
        default: "2"
      max_calls:
        description: "Hard cap of Gemini calls per quota day (daily default 12)"
        default: "12"
      dry_run:
        description: "Dry run: write nothing to the bank, only show the accepted stories in full in the log"
        type: boolean
        default: true
  # DAILY SCHEDULE IS OFF until the owner has read the first dry-run stories. To turn on: remove the two "#" below.
  # schedule:
  #   - cron: "30 8 * * *"   # 08:30 UTC = 14:00 IST
permissions:
  contents: write
concurrency:
  group: dashx-refill   # its own group: never shared with the poster or the reel factory
  cancel-in-progress: false
jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: reelfactory
    steps:
      - uses: actions/checkout@v4
      - name: Pause switch
        id: stop
        working-directory: .
        run: |
          if [ -e STOP_QUEUE ] || [ -e reelfactory/STOP_QUEUE ] || [ -e STOP_REFILL ] || [ -e reelfactory/STOP_REFILL ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::warning::paused by a STOP file"
          fi
      - uses: actions/setup-python@v5
        if: steps.stop.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reelfactory/requirements-ci.txt
      - name: Install dependencies
        if: steps.stop.outputs.skip != 'true'
        run: pip install -r requirements-ci.txt requests
      - name: Write the daily stories (never fails the job)
        if: steps.stop.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 11
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/refill_bank.py --target "${{ github.event.inputs.target || '2' }}" --max-calls "${{ github.event.inputs.max_calls || '12' }}" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Save new stories, call counter and daily line
        if: always() && steps.stop.outputs.skip != 'true'
        continue-on-error: true
        working-directory: .
        run: |
          git config user.name "dashx-factory"
          git config user.email "dashx-factory@users.noreply.github.com"
          git add reelfactory/stories/dialogue_bank.md reelfactory/stories/refill_log.md reelfactory/stories/refill_usage.json reelfactory/stories/refill_daily.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Story refill: daily stories + call counter"
            for i in 1 2 3 4 5; do
              if git pull --rebase -q --autostash origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 6))
            done
            echo "::warning::could not push the refill results"
          fi
