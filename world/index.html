<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =================================================================
   DASHX WORLD VILLAGE
   A realistic alpine-style 3D village of the DASHX business:
   Nav Durga Sports, Meerut - tennis ball factory + software side.
   Voice: English.  Subtitles: Hindi (Devanagari).
================================================================= */

const PLACES = {
  factory:{kicker:'Production',name:'DASHX Ball Factory',sub:'Where every DASHX cricket tennis ball is made',
    list:['Rubber core moulded, then wrapped in a felt cover - 6.5 cm diameter.','Three grades: Red Heavy, Yellow Light, Green Extra Duty.','Packs of 3, 6 and 12 go down the same line.','Capacity is not the bottleneck - up to 10,000 orders a day.'],
    stat:[['6.5 cm','Diameter'],['3','Grades'],['10,000','Orders / day']]},
  hq:{kicker:'Headquarters',name:'Nav Durga Sports HQ',sub:'Meerut, Uttar Pradesh - the sports goods capital',
    list:['Owner Vineet Sharma, 20+ years in the sports goods trade.','DASHX is the brand; Nav Durga Sports is the manufacturer.','Trademark application No. 7720298, Class 28.','Bulk supply to buyers across India, including South India.'],
    stat:[['20+','Years'],['Meerut','Base'],['Class 28','Trademark']]},
  warehouse:{kicker:'Dispatch',name:'Dispatch Warehouse',sub:'Four marketplaces, one packing floor',
    list:['Live on Flipkart, Amazon, Meesho and Mystore.','LDPE NSB2 serialised security bags - required for SPF claims.','COD and UPI both accepted; prepaid is pushed to cut RTO.','RTO is the real enemy here, not demand.'],
    stat:[['4','Marketplaces'],['COD + UPI','Payments'],['NSB2','Secure bags']]},
  nexus:{kicker:'R &amp; D',name:'NEXUS X Lab',sub:'The AI and automation side of DASHX',
    list:['Policy gate: every risky action needs a human approval first.','Hash-chained audit log - an agent can never approve itself.','Simulated 3D printer and digital twin, clearly labelled as simulated.','Hard rule: AI gets no unrestricted access to machines or payments.'],
    stat:[['Policy gate','Guardrail'],['Hash chain','Audit log'],['Simulated','Printer']]},
  code:{kicker:'Software',name:'Code House',sub:'The apps that actually run the business',
    list:['FK Profit Tracker - per-order profit after marketplace fees.','Khata Dost - ledger for dealers and bulk buyers.','NDS Billing - invoices for the factory side.','FastAPI + SQLite backend, pytest green before anything ships.'],
    stat:[['3','Live apps'],['FastAPI','Backend'],['pytest','Gate']]},
  ground:{kicker:'Brand story',name:'Gali Cricket Ground',sub:'Put the phone down, pick up the bat',
    list:['Where the DASHX reels are set - Sachin and Surya, the two regulars.','Three reels a day: morning, afternoon and night slot.','Painted 3D-cartoon scenes, voice-over and subtitles.','No celebrity faces, no film songs, no fake claims. Ever.'],
    stat:[['3 / day','Reels'],['20-30 s','Length'],['9:16','Format']]}
};

// English voice line, Hindi subtitle, caption
const NARR = {
  welcome:['Welcome to DASHX World Village. Tap any building to explore.',
           'DASHX वर्ल्ड विलेज में आपका स्वागत है। किसी भी इमारत पर टैप करें।','DASHX World'],
  factory:['This is the DASHX Ball Factory. A rubber core with a felt cover, six and a half centimetres across. Capacity of up to ten thousand orders a day.',
           'यह है DASHX बॉल फैक्ट्री। रबर कोर पर फेल्ट कवर, साढ़े छह सेंटीमीटर की बॉल। रोज़ दस हज़ार ऑर्डर तक की क्षमता।','DASHX Ball Factory'],
  hq:['Nav Durga Sports, Meerut. More than twenty years in sports goods, and DASHX is our own brand.',
      'नव दुर्गा स्पोर्ट्स, मेरठ। खेल के सामान में बीस साल से ज़्यादा का अनुभव, और DASHX हमारा अपना ब्रांड।','Nav Durga Sports HQ'],
  warehouse:['The dispatch warehouse. Orders from Flipkart, Amazon, Meesho and Mystore are all packed right here.',
             'डिस्पैच वेयरहाउस। फ्लिपकार्ट, अमेज़न, मीशो और मायस्टोर — चारों जगह के ऑर्डर यहीं पैक होते हैं।','Dispatch Warehouse'],
  nexus:['The NEXUS X Lab. AI does the work here, but every big decision needs a human approval.',
         'नेक्सस एक्स लैब। यहाँ AI काम करता है, लेकिन हर बड़े फ़ैसले पर इंसान की मंज़ूरी ज़रूरी है।','NEXUS X Lab'],
  code:['The Code House. FK Profit Tracker, Khata Dost and NDS Billing. These apps run the whole business.',
        'कोड हाउस। FK प्रॉफ़िट ट्रैकर, खाता दोस्त और NDS बिलिंग — पूरा बिज़नेस इन्हीं ऐप्स से चलता है।','Code House'],
  ground:['The gali cricket ground. Put the phone down, pick up the bat. This is where the DASHX story begins.',
          'गली क्रिकेट ग्राउंड। मोबाइल छोड़ो, क्रिकेट खेलो — यहीं से DASHX की कहानी शुरू होती है।','Gali Cricket Ground']
};

// ---------------- math helpers ----------------
const TAU = Math.PI*2;
let seed = 20261128;
const R = () => (seed = (seed*16807) % 2147483647) / 2147483647;
function hash(x,y){ const s = Math.sin(x*127.1 + y*311.7)*43758.5453; return s - Math.floor(s); }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){ let s=0,a=.5,f=1; for(let i=0;i<5;i++){ s+=a*vnoise(x*f,y*f); f*=2.03; a*=.5; } return s; }
function sstep(a,b,x){ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); }
const FLAT = 96;
function terrainH(x,z){
  const r = Math.hypot(x,z);
  const m = sstep(FLAT, 230, r);
  if (m <= 0) return 0;
  return m*(fbm(x*.010+3.1, z*.010+7.7)*64 + (r-FLAT)*0.11);
}

// ---------------- renderer / scene ----------------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const MAXANI = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.5, 2600);

const SKY = {
  day:  {top:0x2c6db3, mid:0xbad7ea, bot:0xdde8ea, sun:0xfff0cc, fog:0xbad7ea, hemi:.5, sunI:2.35, amb:.05, exp:1.02},
  night:{top:0x04070f, mid:0x16223a, bot:0x0d1424, sun:0x9fb4ff, fog:0x16223a, hemi:.10, sunI:.28, amb:.03, exp:1.15}
};
let night = false;

// ---------------- sky dome ----------------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ top:{value:new THREE.Color(SKY.day.top)}, mid:{value:new THREE.Color(SKY.day.mid)},
             bot:{value:new THREE.Color(SKY.day.bot)}, sunCol:{value:new THREE.Color(SKY.day.sun)},
             sunDir:{value:new THREE.Vector3(.62,.42,.66).normalize()}, glow:{value:1.0} },
  vertexShader:`varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform vec3 top, mid, bot, sunCol, sunDir; uniform float glow; varying vec3 vDir;
    void main(){
      float h = vDir.y;
      vec3 c = h > 0.0 ? mix(mid, top, pow(clamp(h,0.0,1.0), 0.5)) : mix(mid, bot, clamp(-h*5.0,0.0,1.0));
      float s = max(dot(normalize(vDir), normalize(sunDir)), 0.0);
      c += sunCol * (pow(s, 1400.0)*2.2 + pow(s, 18.0)*0.20*glow + pow(s,4.0)*0.06*glow);
      gl_FragColor = vec4(c, 1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 40, 20), skyMat);
scene.add(sky);
scene.background = new THREE.Color(SKY.day.mid);
scene.fog = new THREE.Fog(SKY.day.fog, 170, 900);

// environment map from the sky (gives glass and wood soft reflections)
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
// env sky uses a vertex-coloured MeshBasicMaterial so PMREM gets properly encoded colours
const envGeo = new THREE.SphereGeometry(40, 64, 32);
envGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(envGeo.attributes.position.count*3), 3));
const envSky = new THREE.Mesh(envGeo, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.BackSide, fog:false}));
envScene.add(envSky);
const groundBounce = new THREE.Mesh(new THREE.CircleGeometry(39, 24), new THREE.MeshBasicMaterial({color:0x5b7a43}));
groundBounce.rotation.x = -Math.PI/2; groundBounce.position.y = -3; envScene.add(groundBounce);
function paintEnv(){
  const u = skyMat.uniforms, p = envGeo.attributes.position, c = envGeo.attributes.color;
  const top = u.top.value.clone().convertSRGBToLinear(), mid = u.mid.value.clone().convertSRGBToLinear(),
        bot = u.bot.value.clone().convertSRGBToLinear(), sc = u.sunCol.value.clone().convertSRGBToLinear();
  const sd = u.sunDir.value.clone().normalize(), v = new THREE.Vector3(), col = new THREE.Color();
  for (let i=0;i<p.count;i++){
    v.set(p.getX(i), p.getY(i), p.getZ(i)).normalize(); const h = v.y;
    if (h > 0) col.copy(mid).lerp(top, Math.pow(Math.min(1,h), .5)); else col.copy(mid).lerp(bot, Math.min(1, -h*5));
    const s = Math.max(v.dot(sd), 0); col.r += sc.r*Math.pow(s,18)*.35*u.glow.value; col.g += sc.g*Math.pow(s,18)*.35*u.glow.value; col.b += sc.b*Math.pow(s,18)*.35*u.glow.value;
    c.setXYZ(i, col.r, col.g, col.b);
  }
  c.needsUpdate = true;
}
function rebuildEnv(){
  paintEnv();
  if (scene.environment) scene.environment.dispose();
  scene.environment = pmrem.fromScene(envScene, 0.04).texture;
}
rebuildEnv();

// ---------------- lights ----------------
const hemi = new THREE.HemisphereLight(0xdcecff, 0x52653a, SKY.day.hemi); scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, SKY.day.amb); scene.add(amb);
const sun = new THREE.DirectionalLight(0xfff0d6, SKY.day.sunI);
sun.position.set(130, 82, 120);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const SS = 120;
Object.assign(sun.shadow.camera, {left:-SS, right:SS, top:SS, bottom:-SS, near:10, far:480});
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun); scene.add(sun.target);

// ---------------- procedural textures ----------------
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function makeTex(size, draw, rep=1){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = MAXANI;
  return t;
}
const grassTex = makeTex(512,(g,s)=>{
  g.fillStyle='#5c7f3a'; g.fillRect(0,0,s,s);
  for(let i=0;i<70;i++){ const x=R()*s,y=R()*s,r=24+R()*80; const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0, R()<.5?'rgba(132,168,74,.32)':'rgba(56,92,38,.32)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r); }
  for(let i=0;i<14000;i++){ const x=R()*s,y=R()*s; g.strokeStyle=`hsla(${80+R()*34},${38+R()*26}%,${26+R()*30}%,.55)`;
    g.lineWidth=1; g.beginPath(); g.moveTo(x,y); g.lineTo(x+(R()-.5)*3,y-2-R()*5); g.stroke(); }
}, 110);
const mowTex = makeTex(256,(g,s)=>{
  for(let i=0;i<8;i++){ g.fillStyle = i%2 ? '#5f8a3d' : '#6b9645'; g.fillRect(0,i*s/8,s,s/8); }
  for(let i=0;i<5000;i++){ g.fillStyle=`hsla(${85+R()*25},45%,${30+R()*25}%,.35)`; g.fillRect(R()*s,R()*s,1,2+R()*3); }
}, 1);
const woodTex = makeTex(256,(g,s)=>{
  const rows=8, h=s/rows;
  for(let i=0;i<rows;i++){ g.fillStyle=`hsl(${22+R()*6},${42+R()*10}%,${24+R()*9}%)`; g.fillRect(0,i*h,s,h);
    for(let k=0;k<34;k++){ g.strokeStyle=`rgba(30,14,4,${.06+R()*.14})`; g.lineWidth=.8+R(); g.beginPath(); const y=i*h+R()*h;
      g.moveTo(0,y); g.bezierCurveTo(s*.3,y+(R()-.5)*5,s*.6,y+(R()-.5)*5,s,y+(R()-.5)*4); g.stroke(); }
    g.fillStyle='rgba(18,8,2,.65)'; g.fillRect(0,i*h,s,2.2); g.fillStyle='rgba(255,220,170,.06)'; g.fillRect(0,i*h+2.2,s,2); }
});
const woodDarkTex = makeTex(128,(g,s)=>{ g.fillStyle='#3b2416'; g.fillRect(0,0,s,s);

// ---------------- geometry helpers ----------------
function boxGeo(w,h,d,ts=4){
  const g = new THREE.BoxGeometry(w,h,d), uv = g.attributes.uv;
  const dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for (let f=0; f<6; f++) for (let i=0; i<4; i++){ const k=f*4+i; uv.setXY(k, uv.getX(k)*dims[f][0]/ts, uv.getY(k)*dims[f][1]/ts); }
  return g;
}
function B(w,h,d,m,x=0,y=0,z=0,ts=4){
  const me = new THREE.Mesh(boxGeo(w,h,d,ts), m); me.position.set(x,y,z); me.castShadow = me.receiveShadow = true; return me;
}
function C(rt,rb,h,m,seg=18){ const me = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), m); me.castShadow = me.receiveShadow = true; return me; }
function gable(span, len, h, oh, m){
  const g = new THREE.Group(); const th = Math.atan2(h, span/2); const L = (span/2 + oh)/Math.cos(th);
  [1,-1].forEach(s=>{
    const p = new THREE.Mesh(boxGeo(L, .42, len + oh*2, 3), m);
    p.castShadow = p.receiveShadow = true; p.rotation.z = -s*th;
    p.position.set(s*(L/2)*Math.cos(th), h - (L/2)*Math.sin(th) + .21, 0); g.add(p);
  });
  const ridge = B(.7,.5,len + oh*2 + .1, mWoodDark, 0, h + .3, 0); g.add(ridge);
  return g;
}
function attic(span, len, h, m){
  const sh = new THREE.Shape(); sh.moveTo(-span/2,0); sh.lineTo(span/2,0); sh.lineTo(0,h); sh.closePath();
  const geo = new THREE.ExtrudeGeometry(sh, {depth:len, bevelEnabled:false}); geo.translate(0,0,-len/2);
  const uv = geo.attributes.uv; for (let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)/4, uv.getY(i)/4);
  const me = new THREE.Mesh(geo, m); me.castShadow = me.receiveShadow = true; return me;
}
function windowUnit(w,h,shutters=true){
  const g = new THREE.Group();
  g.add(B(w+.34, h+.34, .2, mFrame));
  const gl = B(w, h, .24, mGlass, 0,0,.05); gl.castShadow = false; g.add(gl);
  g.add(B(.11, h, .3, mFrame, 0,0,.08)); g.add(B(w, .11, .3, mFrame, 0, h*.15, .08));
  if (shutters) [-1,1].forEach(s=> g.add(B(w*.52, h+.16, .14, mShutter, s*(w*.5 + w*.26 + .22), 0, .02)));
  g.add(B(w+.7, .16, .55, mFrame, 0, -h/2-.22, .2));
  // flower box
  if (shutters){ g.add(B(w+.2,.42,.5, mWoodDark, 0, -h/2-.55, .35));
    for (let i=0;i<5;i++){ const f = new THREE.Mesh(new THREE.IcosahedronGeometry(.2,0), M({color:[0xd8423a,0xf0c43c,0xe86fa0,0xd8423a,0xffffff][i]}));
      f.position.set(-w/2+.2+i*(w-.4)/4, -h/2-.25, .42); g.add(f); } }
  return g;
}
function railing(len, h, m){
  const g = new THREE.Group(); const n = Math.round(len/0.55);
  for (let i=0;i<=n;i++) g.add(B(.12, h, .12, m, -len/2 + i*len/n, h/2, 0, 1));
  g.add(B(len+.2, .16, .2, m, 0, h, 0)); g.add(B(len, .1, .14, m, 0, h*.4, 0));

}
function signBoard(text, sub, w, h){
  const c = document.createElement('canvas'); c.width = 1024; c.height = Math.round(1024*h/w);
  const g = c.getContext('2d');
  g.fillStyle = '#1a1e23'; g.fillRect(0,0,c.width,c.height);
  g.strokeStyle = '#e0e63c'; g.lineWidth = Math.max(6, c.height*.05); g.strokeRect(g.lineWidth/2,g.lineWidth/2,c.width-g.lineWidth,c.height-g.lineWidth);
  g.fillStyle = '#f4f1e8'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const fs = sub ? c.height*.44 : c.height*.56;
  g.font = `800 ${fs}px Outfit, sans-serif`;
  const maxW = c.width*.9; let tw = g.measureText(text).width; if (tw > maxW){ g.font = `800 ${fs*maxW/tw}px Outfit, sans-serif`; }
  g.fillText(text, c.width/2, sub ? c.height*.4 : c.height*.54);
  if (sub){ g.fillStyle = '#e0e63c'; g.font = `700 ${c.height*.2}px Outfit, sans-serif`; g.fillText(sub, c.width/2, c.height*.77); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = MAXANI;
  const m = M({map:t, roughness:.55, emissive:0xffffff, emissiveMap:t, emissiveIntensity:0});
  signMats.push(m);
  const g2 = new THREE.Group();
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w,h), m); face.position.z = .09; g2.add(face);
  g2.add(B(w+.2, h+.2, .16, mWoodDark));

}
function tennisBall(r, color){

// keep-out zones for trees/rocks
const zones = [];
function keepOut(x,z,r){ zones.push({x,z,r}); }
const segs = [];
function free(x,z,pad=0){
  for (const k of zones) if (Math.hypot(x-k.x, z-k.z) < k.r + pad) return false;
  for (const s of segs){ const dx=s[2]-s[0], dz=s[3]-s[1], L=dx*dx+dz*dz; let t=((x-s[0])*dx+(z-s[1])*dz)/L; t=Math.max(0,Math.min(1,t));
    if (Math.hypot(x-(s[0]+t*dx), z-(s[1]+t*dz)) < 5 + pad) return false; }
  return true;
}

function build(){
  // ---------- terrain ----------
  const SIZE = 1100, SEG = 220;
  const tg = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG); tg.rotateX(-Math.PI/2);
  const pos = tg.attributes.position, col = new Float32Array(pos.count*3);
  const cA = new THREE.Color(0x8aa860), cB = new THREE.Color(0x5f7f42), cRock = new THREE.Color(0x8c8a84), cSnow = new THREE.Color(0xf4f6f8), tmp = new THREE.Color();
  for (let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i), y = terrainH(x,z); pos.setY(i, y);
    tmp.copy(cA).lerp(cB, fbm(x*.03, z*.03));
    if (y > 46) tmp.lerp(cRock, sstep(46, 80, y));
    if (y > 92) tmp.lerp(cSnow, sstep(92, 120, y));
    tmp.convertSRGBToLinear(); col[i*3]=tmp.r; col[i*3+1]=tmp.g; col[i*3+2]=tmp.b;
  }
  tg.setAttribute('color', new THREE.BufferAttribute(col,3)); tg.computeVertexNormals();
  const terrain = new THREE.Mesh(tg, M({map:grassTex, vertexColors:true, roughness:1}));
  terrain.receiveShadow = true; scene.add(terrain);

  // ---------- distant mountains ----------
  const mtnMat = M({vertexColors:true, flatShading:true, roughness:1});
  for (let i=0;i<18;i++){
    const ang = i/18*TAU + R()*.2, rad = 560 + R()*220, h = 170 + R()*190, r = 150 + R()*120;
    const geo = new THREE.ConeGeometry(r, h, 40, 14, true);
    const p = geo.attributes.position, cc = new Float32Array(p.count*3);
    for (let k=0;k<p.count;k++){
      const x=p.getX(k), y=p.getY(k), z=p.getZ(k); const t=(y+h/2)/h;
      const n = fbm(x*.02+i*7, z*.02+y*.015)*.55 + .7;
      const sc = (1-t*.15) * n; p.setX(k, x*sc); p.setZ(k, z*sc); p.setY(k, y + (fbm(x*.03,z*.03)-.5)*h*.12);
      const c = new THREE.Color(0x6e7d73).lerp(new THREE.Color(0x8a8f96), sstep(.15,.45,t));
      if (t > .58 + (n-.7)*.25) c.lerp(new THREE.Color(0xf5f7fa), .92);
      c.convertSRGBToLinear(); cc[k*3]=c.r; cc[k*3+1]=c.g; cc[k*3+2]=c.b;
    }

  const ring = new THREE.Mesh(ringGeo, mDirt); ring.rotation.x = -Math.PI/2; ring.position.y = .05; ring.receiveShadow = true; scene.add(ring);
  // kerb stones
  const kerb = new THREE.Mesh(new THREE.TorusGeometry(15.1, .28, 6, 96), mStone); kerb.rotation.x = -Math.PI/2; kerb.position.y = .12; kerb.receiveShadow = true; scene.add(kerb);
  keepOut(0,0,27);

    const pl = new THREE.Group(); pl.add(B(1.8,1.1,1.8, mStone, 0,.55,0,2));

    for (let f=0;f<6;f++){ const fl = new THREE.Mesh(new THREE.IcosahedronGeometry(.22,0), M({color:[0xe0e63c,0xd8423a,0xffffff][f%3]})); fl.position.set((R()-.5)*1.6, 2+R()*.6, (R()-.5)*1.6); pl.add(fl); }

  // ---------- FACTORY ----------
  factory = new THREE.Group();
  factory.add(B(30, 1.4, 17, mStone, 0, .7, 0));

  factory.add(B(30.2, .7, 17.2, mConcrete, 0, 10.6, 0));
  for (let i=-2;i<=2;i++){
    const x = i*5.9;
    const p = B(6.3, .36, 17.4, mRoof, x - .3, 12.3, 0, 3); p.rotation.z = .44; factory.add(p);

  [-12.2,-7.6,7.6,12.2].forEach(x=>{ const w = windowUnit(2.6, 4, false); w.position.set(x, 5.6, 8.25); factory.add(w); });
  [-12.2,-6.1,0,6.1,12.2].forEach(x=>{ const w = windowUnit(2.6, 3.4, false); w.position.set(x, 5.6, -8.25); w.rotation.y = Math.PI; factory.add(w); });

  const fSign = signBoard('DASHX', 'BALL FACTORY', 9.6, 2.3); fSign.position.set(0, 9.9, 8.55); factory.add(fSign);
  [-9.5, 9.5].forEach(x=>{ factory.add(B(2.2, 10, 2.2, mBrick, x, 15, -4.6, 3)); factory.add(B(2.7, .6, 2.7, mConcrete, x, 20.2, -4.6));

    const g = new THREE.Group(); g.add(B(2.6,.3,2.6, mWood, 0,.15,0,2)); g.add(B(2.4,1.6,2.4, M({color:0xe8c79a, map:woodTex}), 0,1.1,0,2));

    g.position.set(-13 + i*3.1, 1.4, 10.8); factory.add(g);

  // ---------- HQ (big alpine chalet) ----------

    g.add(B(2.2, 2.5, 2.8, M({color:0xeeeeea, roughness:.4}), 2.6, 1.95, 0, 1));
    const ws = B(.1, 1.1, 2.4, mGlass, 3.72, 2.5, 0, 1); g.add(ws);
    [-2.4, -.2, 2.6].forEach(x=>[-1.45,1.45].forEach(z=>{ const w = C(.55,.55,.4, M({color:0x1b1e22, roughness:.8}), 14); w.rotation.x = Math.PI/2; w.position.set(x,.55,z); g.add(w); }));
    g.traverse(o=>{ if (o.isMesh) o.castShadow = true; });
    scene.add(g); return g;
  }
  trucks = [ {g:truck(0xc8423a), a:0, sp:.16, r:20.5}, {g:truck(0x2f6f9f), a:Math.PI, sp:.16, r:17.4, rev:true} ];

  // ---------- chimney smoke ----------
  const smokeM = new THREE.SpriteMaterial({map: makeTex(128,(g,s)=>{ const gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    gr.addColorStop(0,'rgba(240,242,245,.9)'); gr.addColorStop(.6,'rgba(230,234,238,.35)'); gr.addColorStop(1,'rgba(230,234,238,0)'); g.fillStyle = gr; g.fillRect(0,0,s,s); }), transparent:true, depthWrite:false});
  for (let i=0;i<24;i++){ const sp = new THREE.Sprite(smokeM.clone()); sp.userData = {c: i%2, t: R()*6}; scene.add(sp); smoke.push(sp); }

  // ---------- clouds ----------
  const cloudTex = makeTex(256,(g,s)=>{ for (let i=0;i<14;i++){ const x = s*.2 + R()*s*.6, y = s*.35 + R()*s*.3, r = s*.12 + R()*s*.16;
    const gr = g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(255,255,255,.9)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0,0,s,s); } });
  for (let i=0;i<16;i++){
    const c = new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex, transparent:true, depthWrite:false, opacity:.85, fog:false}));
    const a = R()*TAU, r = 200 + R()*500; c.position.set(Math.cos(a)*r, 150 + R()*110, Math.sin(a)*r);
    const s = 120 + R()*160; c.scale.set(s, s*.45, 1); c.userData = {sp: .6 + R()*1.2}; scene.add(c); clouds.push(c);
  }

  // ---------- stars (night) ----------
  const sg = new THREE.BufferGeometry(), sp = [];
  for (let i=0;i<1600;i++){ const u = R()*TAU, v = Math.acos(R()*.95); const r = 1500;
    sp.push(Math.sin(v)*Math.cos(u)*r, Math.cos(v)*r, Math.sin(v)*Math.sin(u)*r); }
  sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  stars = new THREE.Points(sg, new THREE.PointsMaterial({color:0xffffff, size:2.2, sizeAttenuation:false, transparent:true, opacity:0, fog:false, depthWrite:false}));
  scene.add(stars);
}

// =====================================================================
// camera orbit
const target = new THREE.Vector3(0, 6, 6);
const HOME = {d:138, y:.62, p:.40};
let dist = HOME.d, yaw = HOME.y, pitch = HOME.p, spin = true;
let dragging = false, lastX = 0, lastY = 0, moved = 0, pinch = 0; const pointers = new Map();
function applyCam(){
  pitch = Math.max(.1, Math.min(1.3, pitch)); dist = Math.max(26, Math.min(320, dist));
  camera.position.set(target.x + dist*Math.cos(pitch)*Math.sin(yaw), target.y + dist*Math.sin(pitch), target.z + dist*Math.cos(pitch)*Math.cos(yaw));
  const minY = terrainH(camera.position.x, camera.position.z) + 4; if (camera.position.y < minY) camera.position.y = minY;
  camera.lookAt(target);
}
applyCam();

const dom = renderer.domElement; dom.style.cursor = 'grab'; dom.style.touchAction = 'none';
dom.addEventListener('pointerdown', e=>{ pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pointers.size === 1){ dragging = true; lastX = e.clientX; lastY = e.clientY; moved = 0; } dom.setPointerCapture(e.pointerId); });
dom.addEventListener('pointermove', e=>{
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pointers.size === 2){ const p = [...pointers.values()]; const d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y); if (pinch){ dist *= pinch/d; applyCam(); } pinch = d; moved += 20; return; }
  if (dragging){ const dx = e.clientX-lastX, dy = e.clientY-lastY; moved += Math.abs(dx)+Math.abs(dy);
    yaw -= dx*.005; pitch += dy*.004; lastX = e.clientX; lastY = e.clientY; applyCam(); if (moved > 6) stopAuto(); }
  else hover(e);
});
function endPtr(e){ pointers.delete(e.pointerId); if (pointers.size < 2) pinch = 0; if (!pointers.size) dragging = false; }
dom.addEventListener('pointerup', e=>{ if (moved < 8) pick(e); endPtr(e); });
dom.addEventListener('pointercancel', endPtr);
dom.addEventListener('wheel', e=>{ e.preventDefault(); dist *= 1 + Math.sign(e.deltaY)*.08; applyCam(); stopTour(); }, {passive:false});

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitAt(e){ ndc.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera);
  for (const h of ray.intersectObjects(clickable, true)) if (h.object.userData.placeId) return h.object.userData.placeId; return null; }
function hover(e){ dom.style.cursor = hitAt(e) ? 'pointer' : 'grab'; }
function pick(e){ const id = hitAt(e); if (id){ stopTour(); openPanel(id); flyTo(id); } }

// ---------------- panel ----------------
const panel = document.getElementById('panel');
function openPanel(id){ const p = PLACES[id]; if (!p) return;
  pKicker.innerHTML = p.kicker; pName.textContent = p.name; pSub.textContent = p.sub;
  pList.innerHTML = p.list.map(t=>'<li>'+t+'</li>').join('');
  pStat.innerHTML = p.stat.map(s=>'<div><b>'+s[0]+'</b><small>'+s[1]+'</small></div>').join('');
  panel.classList.add('open'); document.body.classList.add('panel'); stopAuto(); narrate(id); }
document.getElementById('close').onclick = ()=>{ panel.classList.remove('open'); document.body.classList.remove('panel'); hideSub(); try{ speechSynthesis.cancel(); }catch(e){} };

// ---------------- voice: English speech, Hindi subtitles ----------------
let voiceOn = false, enVoice = null, subTimer = null;
const subbar = document.getElementById('subbar'), subtext = document.getElementById('subtext'), subwho = document.getElementById('subwho');
function pickVoice(){
  if (!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices() || [];
  const pref = [v=>/^en[-_]IN/i.test(v.lang), v=>/^en[-_]GB/i.test(v.lang) && /google|natural|neural/i.test(v.name), v=>/^en[-_]US/i.test(v.lang) && /google|natural|neural/i.test(v.name), v=>/^en[-_]GB/i.test(v.lang), v=>/^en/i.test(v.lang)];
  for (const f of pref){ const v = vs.find(f); if (v) return (enVoice = v); }
  return null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function showSub(hi, who, ms){ subtext.textContent = hi; subwho.textContent = who || ''; subbar.classList.add('show');
  clearTimeout(subTimer); subTimer = setTimeout(hideSub, ms); }
function hideSub(){ subbar.classList.remove('show'); }
function narrate(id){
  const n = NARR[id]; if (!n) return;
  const ms = Math.max(5200, n[0].length*72);
  showSub(n[1], n[2], ms);
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(n[0]);
    if (!enVoice) pickVoice(); if (enVoice){ u.voice = enVoice; u.lang = enVoice.lang; } else u.lang = 'en-IN';
    u.rate = .96; u.pitch = 1;
    u.onend = ()=>{ clearTimeout(subTimer); subTimer = setTimeout(hideSub, 900); };
    speechSynthesis.speak(u);
  }catch(e){}
}
const btnVoice = document.getElementById('btnVoice');
btnVoice.onclick = ()=>{
  if (!('speechSynthesis' in window)){ showSub('इस ब्राउज़र में आवाज़ उपलब्ध नहीं है — सबटाइटल चलते रहेंगे।', 'Voice not supported', 4500); return; }
  voiceOn = !voiceOn; btnVoice.classList.toggle('on', voiceOn); btnVoice.textContent = voiceOn ? 'Voice on' : 'Voice';
  if (voiceOn) narrate('welcome'); else { try{ speechSynthesis.cancel(); }catch(e){} hideSub(); }
};

// ---------------- buttons ----------------
const btnSpin = document.getElementById('btnSpin'), btnTour = document.getElementById('btnTour');
function stopAuto(){ spin = false; btnSpin.classList.remove('on'); }
btnSpin.onclick = ()=>{ spin = !spin; btnSpin.classList.toggle('on', spin); if (spin) stopTour(); };
document.getElementById('btnReset').onclick = ()=>{ stopTour(); fly(new THREE.Vector3(0,6,6), HOME.d, HOME.y, HOME.p); panel.classList.remove('open'); document.body.classList.remove('panel'); hideSub(); };
const btnLabels = document.getElementById('btnLabels');
btnLabels.onclick = ()=>{ const on = !btnLabels.classList.contains('on'); btnLabels.classList.toggle('on', on); labels.forEach(l=> l.visible = on); };
addEventListener('keydown', e=>{ if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean'); });

const btnNight = document.getElementById('btnNight');
btnNight.onclick = ()=>{
  night = !night; const S = night ? SKY.night : SKY.day;
  btnNight.classList.toggle('on', night); btnNight.textContent = night ? 'Day' : 'Night';
  skyMat.uniforms.top.value.set(S.top); skyMat.uniforms.mid.value.set(S.mid); skyMat.uniforms.bot.value.set(S.bot);
  skyMat.uniforms.sunCol.value.set(S.sun); skyMat.uniforms.glow.value = night ? .3 : 1;
  skyMat.uniforms.sunDir.value.set(night ? -.5 : .62, night ? .55 : .42, night ? -.4 : .66).normalize();
  scene.fog.color.set(S.fog); scene.background.set(S.mid);
  groundBounce.material.color.set(night ? 0x111a14 : 0x5b7a43);
  rebuildEnv();
  hemi.intensity = S.hemi; sun.intensity = S.sunI; amb.intensity = S.amb; renderer.toneMappingExposure = S.exp;
  sun.color.set(night ? 0x8fa6ff : 0xfff0d6);
  sun.position.set(night ? -90 : 124, night ? 120 : 96, night ? -70 : 132);
  glowMats.forEach(m=>{ m.emissive.copy(lin(night ? 0xffc477 : 0x000000)); m.emissiveIntensity = night ? (m === mGlassTower ? .35 : 1.1) : 0; });
  signMats.forEach(m=> m.emissiveIntensity = night ? .55 : 0);
  lampMats.forEach(m=>{ m.emissive.copy(lin(night ? 0xffd9a0 : 0x000000)); m.emissiveIntensity = night ? 1.6 : 0; });
  lampLights.forEach(l=> l.intensity = night ? 2.2 : 0);
  stars.material.opacity = night ? .9 : 0;
  clouds.forEach(c=> c.material.opacity = night ? .12 : .85);
};

// ---------------- camera flights + tour ----------------
const SPOTS = {
  factory:{t:[-40,8,-32], d:62, y:-2.25, p:.34}, warehouse:{t:[40,7,-32], d:60, y:2.25, p:.34},
  nexus:{t:[46,11,16], d:58, y:1.2, p:.3}, code:{t:[20,6,44], d:46, y:.42, p:.36},
  ground:{t:[-12,3,62], d:52, y:-.1, p:.42}, hq:{t:[-44,8,18], d:56, y:-1.2, p:.33}
};
let flight = null;
function fly(t, d, y, p, ms=2400){
  // shortest yaw path
  let dy = y - yaw; dy = ((dy + Math.PI) % TAU + TAU) % TAU - Math.PI;
  flight = {t0:performance.now(), ms, from:{t:target.clone(), d:dist, y:yaw, p:pitch}, to:{t, d, y: yaw + dy, p}};
}
function flyTo(id){ const s = SPOTS[id]; if (s) fly(new THREE.Vector3(...s.t), s.d, s.y, s.p); }
const TOUR = ['factory','warehouse','nexus','code','ground','hq'];
let touring = false, tourIdx = 0, tourNext = 0;
btnTour.onclick = ()=>{ if (touring){ stopTour(); return; } touring = true; btnTour.classList.add('on'); stopAuto(); tourIdx = 0; tourStep(); };
function tourStep(){ const id = TOUR[tourIdx % TOUR.length]; flyTo(id); openPanel(id); tourNext = performance.now() + 2400 + Math.max(6200, NARR[id][0].length*74); tourIdx++; }
function stopTour(){ touring = false; btnTour.classList.remove('on'); }

// ---------------- loop ----------------
const clock = new THREE.Clock();
function frame(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  sky.position.copy(camera.position); stars.position.copy(camera.position);

  if (flight){ const k = Math.min(1, (performance.now()-flight.t0)/flight.ms); const e = k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    target.lerpVectors(flight.from.t, flight.to.t, e); dist = flight.from.d + (flight.to.d-flight.from.d)*e;
    yaw = flight.from.y + (flight.to.y-flight.from.y)*e; pitch = flight.from.p + (flight.to.p-flight.from.p)*e; applyCam(); if (k >= 1) flight = null; }
  else if (spin){ yaw += dt*.06; applyCam(); }
  if (touring && performance.now() > tourNext) tourStep();

  if (bigBall){ bigBall.rotation.y += dt*.45; bigBall.position.y = 9.4 + Math.sin(t*1.1)*.18; }
  if (nexus){ nexus.userData.ring.rotation.z += dt*.55; nexus.userData.core.rotation.y += dt*.9; nexus.userData.core.rotation.x += dt*.4; }
  if (codeHouse) codeHouse.userData.cubes.children.forEach((c,i)=>{ c.rotation.y += dt*(.8+i*.3); c.position.y = 14.4 + i*1.5 + Math.sin(t*1.6+i)*.25; });
  if (hq){ const f = hq.userData.flag, p = f.geometry.attributes.position;
    for (let i=0;i<p.count;i++){ const x = p.getX(i) + 1.8; p.setZ(i, Math.sin(x*1.6 - t*4.5)*.16*(x/3.6)); } p.needsUpdate = true; }

  // cricket: bowl -> hit -> ball returns
  if (bowl.ball){ const ph = (t % 3.2)/3.2, b = bowl.ball.position;
    if (ph < .38){ const k = ph/.38; const z = 8.6 - k*15.2; const bounceAt = .62;
      const y = k < bounceAt ? 2.6 - (2.6-.15)*(k/bounceAt)*(k/bounceAt) : .15 + Math.sin((k-bounceAt)/(1-bounceAt)*Math.PI*.6)*1.2;
      b.set(-.2 + k*.9, Math.max(.15,y), z); }
    else { const k = (ph-.38)/.62; b.set(.7 - k*9, .9 + Math.sin(k*Math.PI)*11, -6.6 + k*24); }
    bowl.ball.rotation.x += dt*12;
    const sw = ph > .3 && ph < .5 ? Math.sin((ph-.3)/.2*Math.PI) : 0;
    bowl.bat.userData.armR.rotation.x = .6 - sw*2.0; bowl.bat.userData.armR.rotation.z = -sw*.5;
    const bw = ph < .3 ? Math.sin(ph/.3*Math.PI) : 0; bowl.bowler.userData.armR.rotation.x = -bw*3; }

  trucks.forEach(tk=>{ tk.a += dt*tk.sp*(tk.rev?-1:1); const x = Math.cos(tk.a)*tk.r, z = Math.sin(tk.a)*tk.r;
    tk.g.position.set(x, 0, z); tk.g.rotation.y = -tk.a + (tk.rev ? Math.PI/2 : -Math.PI/2); });

  smoke.forEach(s=>{ s.userData.t += dt; const life = (s.userData.t % 6)/6, top = chimneyTops[s.userData.c]; if (!top) return;
    s.position.set(top.x + life*7 + Math.sin(life*6+s.userData.t)*.8, top.y + life*16, top.z + life*3);
    const sc = 2 + life*9; s.scale.set(sc, sc, 1); s.material.opacity = (night ? .25 : .6)*(1-life)*Math.min(1, life*6); });

  clouds.forEach(c=>{ c.position.x += dt*c.userData.sp; if (c.position.x > 700) c.position.x = -700; });

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// start once the fonts are ready so signboards render with the right typeface
const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('800 40px Outfit'), document.fonts.load('600 20px Outfit')]) : Promise.resolve();
Promise.race([fontsReady, new Promise(r=>setTimeout(r, 2500))]).then(()=>{
  build();
  scene.traverse(o=>{ if (!o.material) return; (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
    if (!m.isMeshStandardMaterial) return;
    m.envMapIntensity = m === mGlassTower ? 1.1 : (m.metalness > .3 ? .7 : .22);
  }); });
  frame();
  setTimeout(()=> document.getElementById('loader').classList.add('gone'), 400);
  setTimeout(()=>{ document.getElementById('hint').style.opacity = '0'; }, 11000);
});
</script>
