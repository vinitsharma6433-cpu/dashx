<style>
/* Layout: full-bleed night sky canvas, title strip on top, cracker dock and Nav Durga Sports ad at the bottom. Taps on the sky fire the chosen cracker. */
:root {
  --sky: #0b0a1f;
  --gold: #ffc23d;
  --ember: #ff6a2b;
  --rose: #ff3d7f;
  --ink: #fff6e3;
  --muted: #b9b0d6;
  --panel: rgba(14, 10, 34, 0.78);
  --line: rgba(255, 214, 150, 0.2);
  --font-display: 'Rozha One', Georgia, 'Times New Roman', serif;
  --font-body: 'Hind', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  position: relative;
  -webkit-tap-highlight-color: transparent;
}
#sky {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
  touch-action: none;
  cursor: crosshair;
}
header, .bottom { position: relative; z-index: 1; pointer-events: none; }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.flame { transform-origin: 17px 14px; animation: flick 0.9s ease-in-out infinite alternate; }
@keyframes flick { from { transform: scale(1, 1) rotate(-2deg); } to { transform: scale(0.92, 1.08) rotate(2deg); } }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(26px, 6.2vw, 40px);
  line-height: 1;
  margin: 0;
  color: var(--gold);
  text-wrap: balance;
  text-shadow: 0 0 18px rgba(255, 150, 40, 0.5);
}
.sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.sub b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.snd {
  pointer-events: auto;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
  flex: none;
}
.snd[aria-pressed="false"] { color: var(--muted); }
.actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; flex: none; }
.snd.share { background: #25d366; border-color: #25d366; color: #04210f; }
.dock {
  width: 100%;
  max-width: 760px;
  margin-inline: auto;
  padding: 10px;
  border-radius: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.ck {
  pointer-events: auto;
  font: inherit;
  color: var(--ink);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 56px;
  padding: 9px 11px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line);
  cursor: pointer;
}
.ck .t { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 15px; }
.ck .n { font-size: 12px; color: var(--muted); }
.sw { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
.ck[aria-pressed="true"] { border-color: var(--gold); background: rgba(255, 194, 61, 0.14); box-shadow: inset 0 0 0 1px var(--gold); }
.ck.show { background: var(--gold); border-color: var(--gold); color: #1a0f00; }
.ck.show .n { color: #4a3000; }
.ck.show.on { background: var(--rose); border-color: var(--rose); color: #fff; }
.ck.show.on .n { color: #ffe3ee; }
.ad {
  width: 100%;
  max-width: 760px;
  margin: 8px auto 0;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 14px;
  border-radius: 14px;
  background: linear-gradient(90deg, #3a0d1f, #4a1608);
  border: 1px solid var(--gold);
}
.ad p { margin: 0; min-width: 0; line-height: 1.3; }
.ad .hd { display: block; font-family: var(--font-display); font-size: 21px; color: var(--gold); }
.ad .sp { display: block; font-size: 13px; color: var(--ink); }
.ad .wish { display: block; margin-top: 3px; font-size: 14px; font-weight: 600; color: var(--gold); }
.ad a {
  pointer-events: auto;
  display: inline-block;
  padding: 9px 16px;
  border-radius: 999px;
  background: var(--gold);
  color: #1a0f00;
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  white-space: nowrap;
}
.ad a[aria-disabled="true"] { opacity: 0.55; cursor: default; }
button:focus-visible, .ad a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .flame { animation: none; } }

<body>


<canvas id="sky" role="img" aria-label="Night sky for firecrackers. Tap to burst a cracker."></canvas>

<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <g class="flame">
        <path d="M17 2c3.2 4.2 4.2 7.4 0 11.6-4.2-4.2-3.2-7.4 0-11.6z" fill="#ffc23d"/>
        <path d="M17 7.5c1.5 2.1 1.7 3.6 0 5.3-1.7-1.7-1.5-3.2 0-5.3z" fill="#fff3c4"/>

    </svg>

</header>

<div class="bottom">
  <div class="dock" role="group" aria-label="Choose a cracker">
    <div class="grid">
      <button class="ck" type="button" data-k="rocket" aria-pressed="true"><span class="t"><i class="sw" style="--c:#ff3d7f"></i>Rocket</span><span class="n">sky burst</span></button>
      <button class="ck" type="button" data-k="anar" aria-pressed="false"><span class="t"><i class="sw" style="--c:#ffc23d"></i>Anar</span><span class="n">fountain</span></button>
      <button class="ck" type="button" data-k="bomb" aria-pressed="false"><span class="t"><i class="sw" style="--c:#ff6a2b"></i>Bomb</span><span class="n">big dhamaka</span></button>
      <button class="ck" type="button" data-k="chakri" aria-pressed="false"><span class="t"><i class="sw" style="--c:#4de1ff"></i>Chakri</span><span class="n">spinner</span></button>
      <button class="ck" type="button" data-k="laadi" aria-pressed="false"><span class="t"><i class="sw" style="--c:#7dff7a"></i>Laadi</span><span class="n">string of pops</span></button>
      <button class="ck show" type="button" id="show"><span class="t">Show</span><span class="n" id="showN">auto fireworks</span></button>
    </div>
  </div>
  <div class="ad">
    <p><span class="hd">Happy Diwali!</span><span class="sp">from Nav Durga Sports, Meerut &middot; DASH X Cricket Tennis Balls</span><span class="wish">Hamari taraf se sab logon ko Diwali ki bahut-bahut shubhkamnayein! &mdash; Vineet Sharma</span></p>
    <a id="shop" target="_blank" rel="noopener">Shop DASH X balls</a>
  </div>
</div>

<script>
(function () {
  'use strict';
  var TAU = Math.PI * 2;
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* Paste the full Nav Durga Sports / DASH X website link between the quotes */
  var SHOP_URL = 'https://vinitsharma6433-cpu.github.io/dashx/';
  var shop = document.getElementById('shop');
  if (SHOP_URL) { shop.href = SHOP_URL; } else { shop.setAttribute('aria-disabled', 'true'); }

  var cv = document.getElementById('sky');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, skyGrad = null, u = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    u = clamp(Math.min(W, H) / 380, 1, 1.5);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, 'rgba(7,6,26,0.30)');
    skyGrad.addColorStop(0.6, 'rgba(30,13,56,0.30)');
    skyGrad.addColorStop(1, 'rgba(74,22,48,0.34)');
  }
  window.addEventListener('resize', resize);
  resize();

  var stars = [];
  for (var s = 0; s < 110; s++) stars.push({ x: Math.random(), y: Math.random() * 0.8, r: rnd(0.4, 1.3), t: rnd(0, TAU) });

  /* ---------- sound (Web Audio, no files needed) ---------- */
  var AC = null, master = null, noiseBuf = null, soundOn = true, armed = false;

  function audio() {
    if (!AC) {
      try {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        AC = new C();
        master = AC.createGain();
        master.gain.value = 0.9;
        var comp = AC.createDynamicsCompressor();
        comp.threshold.value = -14; comp.ratio.value = 8;
        master.connect(comp); comp.connect(AC.destination);
        var len = AC.sampleRate;
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; return null; }
    }
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e2) {} }
    return AC;
  }
  function canPlay() { return armed && soundOn && audio(); }

  function noiseBurst(o) {
    var a = canPlay(); if (!a) return;
    var t = a.currentTime + (o.delay || 0);
    var src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    var f = a.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.8;
    f.frequency.setValueAtTime(o.freq, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol, t + (o.attack || 0.004));
    if (o.hold) g.gain.setValueAtTime(o.vol, t + Math.max(o.dur - 0.3, 0.05));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.5); src.stop(t + o.dur + 0.05);
  }
  function tone(o) {
    var a = canPlay(); if (!a) return;
    var t = a.currentTime + (o.delay || 0);
    var os = a.createOscillator(); os.type = o.type || 'sine';
    os.frequency.setValueAtTime(o.from, t);
    os.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol, t + (o.attack || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    os.connect(g); g.connect(master);
    os.start(t); os.stop(t + o.dur + 0.05);
  }
  var snd = {
    boom: function (v) {
      v = v || 1;
      noiseBurst({ type: 'lowpass', freq: 2400, to: 90, dur: 1.1, vol: 0.9 * v, q: 0.7 });
      tone({ from: 140, to: 32, dur: 0.7, vol: 0.9 * v });
      noiseBurst({ type: 'highpass', freq: 1800, dur: 0.09, vol: 0.5 * v });
    },
    pop: function (v) {
      v = v || 1;
      noiseBurst({ type: 'bandpass', freq: 2600, q: 0.7, dur: 0.12, vol: 0.4 * v });
      tone({ from: 420, to: 120, dur: 0.08, vol: 0.25 * v, type: 'triangle' });
    },
    crackle: function (n) {
      for (var i = 0; i < n; i++) noiseBurst({ type: 'bandpass', freq: rnd(2500, 5000), q: 0.9, dur: 0.05, vol: rnd(0.12, 0.28), delay: rnd(0.15, 1.1) });
    },
    fuse: function (d) { noiseBurst({ type: 'highpass', freq: 5000, q: 0.6, dur: d, vol: 0.09, attack: 0.05, hold: true }); },
    whistle: function (d) { tone({ from: 520, to: 1900, dur: d, vol: 0.07, attack: 0.05 }); },
    hiss: function (d, dl) {
      noiseBurst({ type: 'bandpass', freq: 4200, q: 0.5, dur: d, vol: 0.16, attack: 0.08, hold: true, delay: dl || 0 });
      noiseBurst({ type: 'lowpass', freq: 500, dur: d, vol: 0.2, attack: 0.1, hold: true, delay: dl || 0 });
    },
    spin: function (d) {
      noiseBurst({ type: 'bandpass', freq: 2400, to: 5200, q: 1.2, dur: d, vol: 0.14, attack: 0.1, hold: true });
      tone({ from: 700, to: 1500, dur: d, vol: 0.04, attack: 0.1, type: 'sawtooth' });
    }
  };

  /* ---------- particles ---------- */
  var P = [], R = [], E = [], props = [], smoke = [], rings = [], pops = [];
  var flash = 0, shake = 0, count = 0;
  var countEl = document.getElementById('count');
  var PAL = [['#ffc23d', '#ff6a2b'], ['#ff3d7f', '#ffd1e3'], ['#4de1ff', '#a7f3ff'], ['#7dff7a', '#eaffd0'], ['#c18bff', '#ffd9ff'], ['#ffffff', '#ffc23d']];
  var ANAR_C = ['#ffd36b', '#fff0b8', '#ff8a2b', '#ffffff'];
  var CHAK_C = ['#ffd36b', '#ff8a2b', '#fff0b8'];

  function spark(x, y, vx, vy, c, life, size, g, d) {
    if (P.length > 3200) return;
    P.push({ x: x, y: y, px: x, py: y, vx: vx, vy: vy, c: c, life: life, max: life, s: size, g: g, d: d });
  }

  function explode(x, y, pal, big) {
    var style = pick(['sphere', 'sphere', 'ring', 'double', 'willow']);
    var n = big ? 170 : 130, sp = big ? 6.5 : 5.2, i, a, v;
    for (i = 0; i < n; i++) {
      a = (i / n) * TAU + rnd(-0.03, 0.03);
      if (style === 'willow') {
        v = sp * rnd(0.4, 1);
        spark(x, y, Math.cos(a) * v, Math.sin(a) * v, pick(pal), rnd(75, 115), 2.6, 0.045, 0.975);
      } else if (style === 'ring' || style === 'double') {
        spark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, pal[0], rnd(55, 80), 3.2, 0.06, 0.982);
        if (style === 'double' && i % 2 === 0) spark(x, y, Math.cos(a) * sp * 0.55, Math.sin(a) * sp * 0.55, pal[1], rnd(50, 70), 3.2, 0.06, 0.982);
      } else {
        a = rnd(0, TAU); v = sp * rnd(0.3, 1);
        spark(x, y, Math.cos(a) * v, Math.sin(a) * v, pick(pal), rnd(55, 90), 3.2, 0.06, 0.982);
      }
    }
    flash = Math.max(flash, reduce ? 0.04 : 0.14);
    snd.boom(big ? 0.8 : 0.55);
    snd.crackle(big ? 9 : 6);
  }

  function rocket(tx, ty) {
    var sx = clamp(tx + rnd(-30, 30), 20, W - 20);
    var dist = Math.max(H - ty, 140), a = 0.09;
    var v0 = Math.sqrt(2 * a * dist), frames = v0 / a;
    R.push({ x: sx, y: H + 4, vx: (tx - sx) / frames, vy: -v0, a: a, ty: ty, pal: pick(PAL) });
    snd.whistle(frames / 60);
  }

  /* bomb: a big ball with a burning fuse first, then the bang */
  function bomb(x, y) {
    props.push({ type: 'bomb', x: x, y: y, t: 0, fuse: 55 });
    snd.fuse(0.9);
  }

  function bang(x, y) {
    var i, a, v;
    flash = Math.max(flash, reduce ? 0.12 : 0.55);
    shake = reduce ? 0 : 16;
    rings.push({ x: x, y: y, r: 6, max: Math.min(W, H) * 0.45 });
    for (i = 0; i < 70; i++) {
      a = rnd(0, TAU); v = rnd(2, 12);
      spark(x, y, Math.cos(a) * v, Math.sin(a) * v, pick(['#fff3c4', '#ffc23d', '#ff6a2b', '#ff3d3d']), rnd(25, 55), 3.4, 0.12, 0.95);
    }
    for (i = 0; i < 14; i++) smoke.push({ x: x + rnd(-12, 12), y: y + rnd(-12, 12), vx: rnd(-0.6, 0.6), vy: rnd(-1, -0.2), r: rnd(14, 26), life: 70, max: 70 });
    snd.boom(1);
    try { if (navigator.vibrate) navigator.vibrate(50); } catch (e) {}
  }

  function anar(x, y) {
    E.push({ type: 'anar', x: x, y: y, t: 0, delay: 40, dur: 230 });
    snd.fuse(0.6);
    snd.hiss(3.2, 0.65);
  }
  function chakri(x, y) { E.push({ type: 'chakri', x: x, y: y, t: 0, dur: 210, ang: rnd(0, TAU) }); snd.spin(3.5); }

  function popAt(x, y, big) {
    var n = big ? 40 : 16, i, a, v;
    for (i = 0; i < n; i++) {
      a = rnd(0, TAU); v = rnd(1, big ? 7 : 4.5);
      spark(x, y, Math.cos(a) * v, Math.sin(a) * v, pick(['#fff3c4', '#ffc23d', '#ffffff']), rnd(12, big ? 34 : 22), 2.6, 0.08, 0.94);
    }
    pops.push({ x: x, y: y, r: big ? 22 : 11, life: 8 });
    flash = Math.max(flash, big ? 0.2 : 0.03);
    if (big) snd.boom(0.6); else snd.pop(rnd(0.7, 1));
  }

  /* laadi: a visible string of red crackers that pop one after another */
  function laadi(x, y) {
    var N = 22, i;
    var sp = Math.min(12 * u, (W - 60) / N);
    var half = (N * sp) / 2;
    var cx = clamp(x, half + 20, Math.max(W - half - 20, half + 21));
    var items = [];
    for (i = 0; i < N; i++) items.push({ x: cx + (i - N / 2) * sp, y: y + Math.sin(i * 0.7) * 14, alive: true, w: Math.min(7 * u, sp - 2) });
    props.push({ type: 'laadi', items: items });
    snd.fuse(0.35);
    items.forEach(function (it, idx) {
      setTimeout(function () {
        it.alive = false;
        popAt(it.x, it.y, idx === N - 1);
      }, 350 + idx * 65);
    });
  }

  var KINDS = { rocket: rocket, anar: anar, bomb: bomb, chakri: chakri, laadi: laadi };
  function fire(kind, x, y) {
    count++; countEl.textContent = String(count);
    KINDS[kind](x, y);
  }

  /* ---------- update + draw ---------- */
  function update(k) {
    var i, p, r, e, j, q, aa, cs, sn, n;
    for (i = P.length - 1; i >= 0; i--) {
      p = P[i];
      p.px = p.x; p.py = p.y;
      var dr = 1 - (1 - p.d) * k;
      p.vx *= dr; p.vy = p.vy * dr + p.g * k;
      p.x += p.vx * k; p.y += p.vy * k;
      p.life -= k;
      if (p.life <= 0) { P[i] = P[P.length - 1]; P.pop(); }
    }
    for (i = R.length - 1; i >= 0; i--) {
      r = R[i];
      r.x += r.vx * k; r.y += r.vy * k; r.vy += r.a * k;
      spark(r.x, r.y + 6 * u, rnd(-0.4, 0.4), rnd(0.8, 2), '#ffb347', rnd(18, 32), 2.6, 0.02, 0.95);
      if (r.vy > -0.7 || r.y <= r.ty - 20) { explode(r.x, r.y, r.pal, false); R.splice(i, 1); }
    }
    for (i = E.length - 1; i >= 0; i--) {
      e = E[i]; e.t += k;
      if (e.type === 'anar') {
        if (e.t < e.delay) {
          spark(e.x + 6 * u, e.y - 42 * u, rnd(-1, 1), rnd(-2.5, -0.5), '#ffd36b', rnd(8, 16), 2.2, 0.1, 0.95);
        } else {
          n = Math.ceil(3 * k);
          for (j = 0; j < n; j++) spark(e.x + rnd(-3, 3), e.y - 40 * u, rnd(-1.7, 1.7), -rnd(6, 11.5), pick(ANAR_C), rnd(40, 78), 2.8, 0.13, 0.985);
        }
      } else {
        e.ang += 0.6 * k;
        for (q = 0; q < 2; q++) {
          aa = e.ang + q * Math.PI; cs = Math.cos(aa); sn = Math.sin(aa);
          spark(e.x + cs * 16 * u, e.y + sn * 16 * u, -sn * 5.5 + cs * 1.4, cs * 5.5 + sn * 1.4, pick(CHAK_C), rnd(22, 40), 2.6, 0.05, 0.965);
        }
        e.x += Math.sin(e.t * 0.07) * 0.7 * k; e.y += Math.cos(e.t * 0.05) * 0.4 * k;
      }
      if (e.t >= e.dur) { popAt(e.x, e.y, e.type === 'anar'); E.splice(i, 1); }
    }
    for (i = props.length - 1; i >= 0; i--) {
      var pr = props[i];
      if (pr.type === 'bomb') {
        pr.t += k;
        spark(pr.x + 4 * u, pr.y - 35 * u, rnd(-1.5, 1.5), rnd(-3.5, -0.5), '#ffd36b', rnd(8, 16), 2.4, 0.1, 0.95);
        if (pr.t >= pr.fuse) { bang(pr.x, pr.y); props.splice(i, 1); }
      } else {
        var alive = false;
        for (j = 0; j < pr.items.length; j++) { if (pr.items[j].alive) { alive = true; break; } }
        if (!alive) props.splice(i, 1);
      }
    }
    for (i = smoke.length - 1; i >= 0; i--) {
      var sm = smoke[i];
      sm.x += sm.vx * k; sm.y += sm.vy * k; sm.r += 0.35 * k; sm.life -= k;
      if (sm.life <= 0) smoke.splice(i, 1);
    }
    for (i = rings.length - 1; i >= 0; i--) {
      var rg = rings[i];
      rg.r += (rg.max - rg.r) * 0.14 * k + 2 * k;
      if (rg.r >= rg.max * 0.98) rings.splice(i, 1);
    }
    for (i = pops.length - 1; i >= 0; i--) {
      pops[i].life -= k;
      if (pops[i].life <= 0) pops.splice(i, 1);
    }
  }

  /* solid objects: drawn normally so they read as real crackers before they go off */
  function drawRocket(r) {
    var ang = Math.atan2(r.vy, r.vx) + Math.PI / 2;
    var L = 48 * u, w = 11 * u;
    var prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(ang);
    ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.moveTo(-w * 0.5, 0); ctx.lineTo(w * 0.5, 0); ctx.lineTo(0, L * 0.7 * rnd(0.8, 1.2)); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.moveTo(-w * 0.25, 0); ctx.lineTo(w * 0.25, 0); ctx.lineTo(0, L * 0.35 * rnd(0.8, 1.2)); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8352b'; ctx.fillRect(-w / 2, -L, w, L);
    ctx.fillStyle = '#ffd24a'; ctx.fillRect(-w / 2, -L * 0.55, w, L * 0.12);
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-w / 2, -L); ctx.lineTo(w / 2, -L); ctx.lineTo(0, -L - w * 1.3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1f7a3a';
    ctx.beginPath(); ctx.moveTo(-w / 2, -L * 0.25); ctx.lineTo(-w * 1.15, 3); ctx.lineTo(-w / 2, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(w / 2, -L * 0.25); ctx.lineTo(w * 1.15, 3); ctx.lineTo(w / 2, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.globalCompositeOperation = prev;
  }

  function drawProps() {
    var i, j, p, e, it, r;
    ctx.globalAlpha = 1;
    for (i = 0; i < props.length; i++) {
      p = props[i];
      if (p.type === 'bomb') {
        r = 17 * u;
        ctx.fillStyle = '#17141f'; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#ffc23d'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(p.x - r * 0.35, p.y - r * 0.35, r * 0.25, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#c9a36a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(p.x, p.y - r); ctx.quadraticCurveTo(p.x + 8 * u, p.y - r - 10 * u, p.x + 4 * u, p.y - r - 18 * u); ctx.stroke();
      } else {
        for (j = 0; j < p.items.length; j++) {
          it = p.items[j];
          if (!it.alive) continue;
          ctx.fillStyle = '#d62b2b'; ctx.fillRect(it.x - it.w / 2, it.y - 7 * u, it.w, 14 * u);
          ctx.fillStyle = '#ffd24a'; ctx.fillRect(it.x - it.w / 2, it.y - 7 * u, it.w, 3 * u);
        }
      }
    }
    for (i = 0; i < E.length; i++) {
      e = E[i];
      if (e.type === 'anar') {
        ctx.fillStyle = '#c8481f';
        ctx.beginPath(); ctx.moveTo(e.x - 15 * u, e.y); ctx.lineTo(e.x + 15 * u, e.y); ctx.lineTo(e.x + 10 * u, e.y - 36 * u); ctx.lineTo(e.x - 10 * u, e.y - 36 * u); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffc23d'; ctx.fillRect(e.x - 12 * u, e.y - 20 * u, 24 * u, 5 * u);
        ctx.fillStyle = '#7a2410'; ctx.fillRect(e.x - 11 * u, e.y - 41 * u, 22 * u, 6 * u);
      } else {
        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.ang);
        ctx.fillStyle = '#1f6fe0'; ctx.beginPath(); ctx.arc(0, 0, 15 * u, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#ffc23d'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-15 * u, 0); ctx.lineTo(15 * u, 0); ctx.moveTo(0, -15 * u); ctx.lineTo(0, 15 * u); ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, 4 * u, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
  }

  function draw(k, now) {
    var i, p, a;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff6e3';
    for (i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = 0.25 + 0.35 * Math.sin(now * 0.001 + st.t);
      ctx.beginPath(); ctx.arc(st.x * W, st.y * H, st.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    var sx = 0, sy = 0;
    if (shake > 0.3) { sx = rnd(-shake, shake); sy = rnd(-shake, shake); shake *= Math.pow(0.86, k); }
    ctx.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);

    drawProps();

    for (i = 0; i < smoke.length; i++) {
      var sm = smoke[i];
      ctx.globalAlpha = (sm.life / sm.max) * 0.22;
      ctx.fillStyle = '#9d92bd';
      ctx.beginPath(); ctx.arc(sm.x, sm.y, sm.r, 0, TAU); ctx.fill();
    }

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (i = 0; i < P.length; i++) {
      p = P[i];
      a = p.life / p.max;
      ctx.globalAlpha = a;
      ctx.strokeStyle = p.c;
      ctx.lineWidth = p.s * (0.4 + a * 0.6);
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    for (i = 0; i < R.length; i++) drawRocket(R[i]);
    for (i = 0; i < E.length; i++) {
      var e = E[i];
      if (e.type === 'anar' && e.t < e.delay) continue;
      var gr = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, 28);
      gr.addColorStop(0, 'rgba(255,200,90,0.65)'); gr.addColorStop(1, 'rgba(255,120,30,0)');
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(e.t * 1.3);
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(e.x, e.y, 28, 0, TAU); ctx.fill();
    }
    for (i = 0; i < pops.length; i++) {
      var po = pops[i];
      ctx.globalAlpha = po.life / 8;
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath(); ctx.arc(po.x, po.y, po.r * (1.2 - po.life / 16), 0, TAU); ctx.fill();
    }
    for (i = 0; i < rings.length; i++) {
      var rg = rings[i];
      ctx.globalAlpha = Math.max(0, 1 - rg.r / rg.max) * 0.8;
      ctx.strokeStyle = '#ffd9a0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, TAU); ctx.stroke();
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    if (flash > 0.01) {
      ctx.globalAlpha = flash; ctx.fillStyle = '#fff0d0';
      ctx.fillRect(0, 0, W, H);
      flash *= Math.pow(0.86, k);
    }
    ctx.globalAlpha = 1;
  }

  var last = performance.now();
  function frame(now) {
    var k = Math.min(50, now - last) / 16.667;
    last = now;
    update(k); draw(k, now);
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);

  /* ---------- controls ---------- */
  var sel = 'rocket';
  var btns = Array.prototype.slice.call(document.querySelectorAll('.ck[data-k]'));
  function demoPos(kind) {
    var x = rnd(W * 0.25, W * 0.75);
    return { x: x, y: (kind === 'rocket' || kind === 'bomb') ? rnd(H * 0.22, H * 0.45) : rnd(H * 0.45, H * 0.6) };
  }
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      sel = b.getAttribute('data-k');
      btns.forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      var d = demoPos(sel);
      fire(sel, d.x, d.y);
    });
  });

  document.addEventListener('pointerdown', function () { armed = true; audio(); }, true);
  cv.addEventListener('pointerdown', function (e) { fire(sel, e.clientX, e.clientY); });

  var PUBLIC_URL = 'https://vinitsharma6433-cpu.github.io/dashx/diwali/';
  var SHARE_TEXT = 'Happy Diwali 🪔🎇 Hamari taraf se sab logon ko Diwali ki bahut-bahut shubhkamnayein! — Vineet Sharma, Nav Durga Sports, Meerut (DASH X cricket tennis balls). Burst digital crackers on your phone: ';
  document.getElementById('share').addEventListener('click', function () {
    if (navigator.share) {
      navigator.share({ title: 'Diwali Dhamaka', text: SHARE_TEXT, url: PUBLIC_URL }).catch(function () {});
      return;
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(SHARE_TEXT + PUBLIC_URL), '_blank', 'noopener');
  });

  var sndBtn = document.getElementById('snd');
  sndBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    sndBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    sndBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
  });

  var showBtn = document.getElementById('show'), showN = document.getElementById('showN');
  var showOn = false, showTimer = null;
  function stopShow() {
    showOn = false; clearTimeout(showTimer);
    showBtn.classList.remove('on'); showN.textContent = 'auto fireworks';
  }
  function startShow() {
    showOn = true; showBtn.classList.add('on'); showN.textContent = 'tap to stop';
    var n = 0;
    (function step() {
      if (!showOn) return;
      if (n >= 36) { stopShow(); return; }
      var kind = pick(['rocket', 'rocket', 'rocket', 'anar', 'bomb', 'chakri', 'laadi']);
      var x = rnd(W * 0.12, W * 0.88);
      var y = kind === 'rocket' ? rnd(H * 0.12, H * 0.5) : rnd(H * 0.4, H * 0.62);
      fire(kind, x, y);
      if (kind === 'rocket' && Math.random() < 0.4) fire('rocket', rnd(W * 0.12, W * 0.88), rnd(H * 0.12, H * 0.45));
      n++;
      showTimer = setTimeout(step, rnd(600, 1300));
    })();
  }
  showBtn.addEventListener('click', function () { if (showOn) stopShow(); else startShow(); });

  /* silent opening: three rockets so the sky is alive before the first tap */
  if (!reduce) {
    [400, 1300, 2200].forEach(function (ms) {
      setTimeout(function () {
        if (armed) return;
        rocket(rnd(W * 0.2, W * 0.8), rnd(H * 0.15, H * 0.4));
      }, ms);
    });
  }
})();
</script>
